<script>
(function(){
  var C = JSON.parse(document.getElementById('rifa-cfg').textContent);
  var S = {}; /* numero -> 'r' | 'v' */
  var ui = { sel: [], sheet: null, nombre: '', apellido: '', loaded: false, err: false };
  try { ui.nombre = localStorage.getItem('rifa_nombre') || ''; ui.apellido = localStorage.getItem('rifa_apellido') || ''; } catch(e) {}
  var money = function(v){ try { return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(v||0); } catch(e){ return '$' + (v||0); } };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var $ = function(id){ return document.getElementById(id); };
  var byNum = function(a,b){ return a-b; };
  function count(e){ var c=0; for (var k in S) if (S[k]===e) c++; return c; }
  function total(n){ var p = C.precio||0, p2 = C.promo2||0; return p2 ? Math.floor(n/2)*p2 + (n%2)*p : n*p; }
  function wa(txt){ return 'https://wa.me/' + String(C.whatsapp||'').replace(/\D/g,'') + '?text=' + encodeURIComponent(txt); }
  function selNums(){ return ui.sel.slice().sort(byNum); }
  function fullName(){ return (ui.nombre + ' ' + ui.apellido).trim(); }
  function toast(msg){ var t = document.createElement('div'); t.className='toast'; t.textContent=msg; t.setAttribute('role','status'); document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3200); }

  /* ---------- lee la planilla publicada ---------- */
  function parseCSV(txt){
    var rows = [], row = [], cur = '', q = false;
    for (var i=0;i<txt.length;i++){ var ch = txt[i];
      if (q) { if (ch==='"') { if (txt[i+1]==='"') { cur+='"'; i++; } else q=false; } else cur+=ch; }
      else if (ch==='"') q=true; else if (ch===',') { row.push(cur); cur=''; }
      else if (ch==='\n' || ch==='\r') { if (ch==='\r' && txt[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
      else cur+=ch; }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function load(){
    if (!/^https:\/\//.test(C.csv||'')) { ui.loaded = true; ui.err = true; render(); return; }
    var get = function(u){ return fetch(u, {cache:'no-store'}).then(function(r){ if (!r.ok) throw 0; return r.text(); }).then(function(t){ if (!/^\s*"?n[uú]mero/i.test(t)) throw 0; return t; }); };
    get(C.csv).catch(function(){ return get(C.csv + '&_=' + Date.now()); }).then(function(t){
      var next = {};
      parseCSV(t).forEach(function(r){ var n = parseInt(r[0],10), e = String(r[1]||'').trim().toLowerCase();
        if (n>=1 && n<=100) { if (e.indexOf('vend')===0 || e.indexOf('pag')===0) next[n]='v'; else if (e.indexOf('res')===0) next[n]='r'; } });
      S = next; ui.loaded = true; ui.err = false;
      ui.sel = ui.sel.filter(function(n){ return !S[n]; });
      if (!ui.sheet) render();
    }).catch(function(){ ui.loaded = true; ui.err = true; if (!ui.sheet) render(); });
  }

  /* ---------- render ---------- */
  function render(){
    var nv = count('v'), nr = count('r');
    var h = '<div class="wrap">';
    h += '<header class="ticket">' + (C.foto ? '<img src="' + esc(C.foto) + '" alt="' + esc(C.premio||'Premio') + '">' : '') +
      '<div class="tk-body"><div class="eyebrow">Rifa · 100 números</div><h1>' + esc(C.titulo || C.premio || 'Rifa') + '</h1>' + (C.detalle ? '<p class="hint" style="font-size:16px">' + esc(C.detalle) + '</p>' : '') +
      '<div class="prices"><div class="price"><small>1 número</small><b>' + money(C.precio) + '</b></div>' +
      (C.promo2 ? '<div class="price promo"><small>Promo 2 números</small><b>' + money(C.promo2) + '</b></div>' : '') + '</div>' +
      '<div class="facts">' + (C.sorteo ? '<span>Sorteo <b>' + esc(C.sorteo) + '</b></span>' : '') + '<span>Quedan <b>' + (ui.loaded && !ui.err ? (100-nv-nr) : '…') + '</b> libres</span></div></div></header>';
    h += '<section class="how"><h3>Cómo participar</h3><ol>' +
      '<li>Tocá los números que quieras de la grilla.</li>' +
      '<li>Poné tu nombre y transferí el total al alias.</li>' +
      '<li>Mandá el comprobante por WhatsApp. Cuando lo confirmemos, tu número queda marcado.</li></ol>' +
      '<div class="alias"><code id="aliasmain">' + esc(C.alias||'—') + '</code><button class="btn sm" data-copy="aliasmain" type="button">Copiar alias</button></div>' +
      (C.titular ? '<p class="hint">Titular: <b style="color:var(--ink)">' + esc(C.titular) + '</b></p>' : '') + '</section>';
    if (ui.err) h += '<div class="warn">No pudimos cargar los números ocupados. Si elegís uno, te confirmamos por WhatsApp que esté libre.</div>';
    h += '<div class="progress"><div class="legend"><span><i class="sw"></i>Libre</span><span><i class="sw p"></i>Tu elección</span><span><i class="sw r"></i>Reservado</span><span><i class="sw s"></i>Vendido</span>' +
      '<span style="margin-left:auto"><b style="color:var(--ink)">' + nv + '</b> vendidos</span></div>' +
      '<div class="bar"><i style="width:' + nv + '%;background:var(--sold)"></i><i style="width:' + nr + '%;background:var(--res)"></i></div></div>';
    h += '<p class="hint">Tocá los números libres que quieras y después tocá <b>Continuar</b>.</p><div class="grid" role="group" aria-label="Números de la rifa">';
    for (var i=1;i<=100;i++){
      var e = S[i], cls = 'n', lab = 'Número ' + i;
      if (e==='v') { cls+=' sold'; lab+=', vendido'; } else if (e==='r') { cls+=' res'; lab+=', reservado'; } else if (ui.sel.indexOf(i)>=0) { cls+=' sel'; lab+=', elegido'; }
      h += '<button type="button" id="n' + i + '" class="' + cls + '" data-n="' + i + '" aria-label="' + lab + '"' + (e?' aria-disabled="true"':'') + '>' + i + '</button>';
    }
    h += '</div></div>';
    if (ui.sel.length) { var ns = selNums();
      h += '<div class="dock"><div class="dock-in"><div class="chips">Elegiste <b>' + ns.join(', ') + '</b><br>Total ' + money(total(ns.length)) + '</div>' +
        '<div class="row" style="flex:0 0 auto"><button class="btn ghost sm" id="clear" type="button">Borrar</button><button class="btn" id="go" type="button">Continuar</button></div></div></div>'; }
    if (ui.sheet) h += sheet();
    $('app').innerHTML = h; bind();
  }

  function sheet(){
    var s = ui.sheet, ns = selNums(), nums = ns.join(', '), tot = money(total(ns.length)), plural = ns.length>1;
    var h = '<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh_t">' +
      '<div class="steps"><i class="on"></i><i class="' + (s.step>=2?'on':'') + '"></i><i class="' + (s.step>=3?'on':'') + '"></i></div>';
    if (s.step===1) {
      h += '<div class="eyebrow">Paso 1 de 3 · ' + (plural?'Números ':'Número ') + nums + '</div><h2 id="sh_t">¿A nombre de quién?</h2>' +
        '<form id="f1" style="display:grid;gap:14px"><div class="row"><label for="b_no">Nombre<input id="b_no" autocomplete="given-name" value="' + esc(ui.nombre) + '" required></label>' +
        '<label for="b_ap">Apellido<input id="b_ap" autocomplete="family-name" value="' + esc(ui.apellido) + '" required></label></div>' +
        '<div class="row"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn" type="submit">Siguiente</button></div></form>';
    } else if (s.step===2) {
      h += '<div class="eyebrow">Paso 2 de 3 · Transferencia</div><h2 id="sh_t">Transferí <span class="total">' + tot + '</span></h2>' +
        '<p class="hint" style="margin:0">' + ns.length + (plural?' números':' número') + (C.promo2 && plural ? ' (con promo)' : '') + '. Hacé la transferencia desde tu banco o billetera a este alias:</p>' +
        '<div class="alias"><code id="aliastxt">' + esc(C.alias||'—') + '</code><button class="btn sm" data-copy="aliastxt" type="button">Copiar</button></div>' +
        (C.titular ? '<p class="hint" style="margin-top:-8px">Titular: <b style="color:var(--ink)">' + esc(C.titular) + '</b></p>' : '') +
        '<div class="note">Guardá el comprobante (captura de pantalla). Lo mandás por WhatsApp en el próximo paso.</div>' +
        '<div class="row"><button class="btn ghost" type="button" data-back>Atrás</button><button class="btn" type="button" id="next2">Ya transferí</button></div>';
    } else {
      var msg = 'Hola! Te mando el comprobante de la rifa de la ' + (C.premio||'rifa') + '.\n' + (plural?'Números: ':'Número: ') + nums + '\nNombre: ' + fullName() + '\nTotal transferido: ' + tot;
      h += '<div class="eyebrow">Paso 3 de 3 · Comprobante</div><h2 id="sh_t">Mandá el comprobante por WhatsApp</h2>' +
        '<p class="hint" style="margin:0">Se abre WhatsApp con un mensaje listo con tus números y tu nombre. Adjuntá la captura del comprobante y envialo.</p>' +
        '<a class="btn wa" href="' + esc(wa(msg)) + '" target="_blank" rel="noopener">Enviar comprobante por WhatsApp</a>' +
        '<p class="hint" style="margin:0">¿No se abre? Escribí al <b style="color:var(--ink);user-select:all">+' + esc(String(C.whatsapp||'').replace(/\D/g,'')) + '</b> con tus números (' + nums + '), tu nombre y el comprobante.</p>' +
        '<div class="note"><b>Tus números quedan marcados cuando confirmemos el pago.</b> Si justo alguien pagó el mismo número antes, te avisamos para elegir otro o te devolvemos la plata.</div>' +
        '<button class="btn ghost" type="button" data-close>Listo</button>';
    }
    return h + '</div></div>';
  }

  function bind(){
    document.querySelectorAll('.n').forEach(function(b){ b.onclick = function(){ tap(+b.dataset.n); }; });
    var x;
    if ((x=$('clear'))) x.onclick = function(){ ui.sel=[]; render(); };
    if ((x=$('go'))) x.onclick = function(){ ui.sheet={step:1}; render(); focusFirst(); };
    document.querySelectorAll('[data-close]').forEach(function(b){ b.onclick = closeSheet; });
    document.querySelectorAll('[data-back]').forEach(function(b){ b.onclick = function(){ ui.sheet.step--; render(); }; });
    document.querySelectorAll('[data-copy]').forEach(function(b){ b.onclick = function(){ copyText(b.dataset.copy); }; });
    if ((x=$('ov'))) x.onclick = function(e){ if (e.target===x) closeSheet(); };
    if ((x=$('f1'))) x.onsubmit = function(e){ e.preventDefault(); ui.nombre=$('b_no').value.trim(); ui.apellido=$('b_ap').value.trim();
      if (!ui.nombre || !ui.apellido) return; try { localStorage.setItem('rifa_nombre',ui.nombre); localStorage.setItem('rifa_apellido',ui.apellido); } catch(err) {}
      ui.sheet.step=2; render(); };
    if ((x=$('next2'))) x.onclick = function(){ ui.sheet.step=3; render(); };
  }
  function copyText(id){ var a = ($(id)&&$(id).textContent)||'', p;
    try { p = navigator.clipboard.writeText(a); } catch(err) { p = Promise.reject(err); }
    p.then(function(){ toast('Alias copiado'); }, function(){ var r=document.createRange(); r.selectNodeContents($(id)); var s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Alias seleccionado: copialo'); }); }
  function focusFirst(){ var i=document.querySelector('.sheet input, .sheet a, .sheet button'); if (i) i.focus(); }
  function closeSheet(){ var done = ui.sheet && ui.sheet.step===3; ui.sheet=null; if (done) ui.sel=[]; render(); }
  document.addEventListener('keydown', function(e){ if (e.key==='Escape' && ui.sheet) closeSheet(); });
  function tap(n){ var e=S[n];
    if (e) { toast('El ' + n + (e==='r'?' está reservado':' ya está vendido')); return; }
    var i=ui.sel.indexOf(n); if (i>=0) ui.sel.splice(i,1); else ui.sel.push(n); render(); var b=$('n'+n); if (b) b.focus(); }

  render(); load(); setInterval(load, 60000);
})();
